[project]
name = "fosanalysis"

version = "0.5"

description = "A framework to evaluate distributed fiber optic sensor data"

readme = "README.md"

requires-python = ">=3.7"

license = "GPL-3.0-only"
license-files = ["LICENSE"]

keywords = [
	"structural health monitoring",
	"distributed fiber optic sensor",
	"DFOS",
	"data evaluation",
	"distributed strain sensing",
	"pre-processing",
	"crack monitoring",
	]

authors = [
	{name = "Bertram Richter", email = "bertram.richter@tu-dresden.de" }
]

maintainers = [
	{name = "Bertram Richter", email = "bertram.richter@tu-dresden.de" }
]

classifiers = [
	"Intended Audience :: Developers",
	"Intended Audience :: Science/Research",
	
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
]

dependencies = [
	"numpy",
	"scipy",
	"brplotviz",
]

[project.urls]
"homepage" = "https://github.com/TUD-IMB/fosanalysis"
"source" = "https://github.com/TUD-IMB/fosanalysis"
"issues" = "https://github.com/TUD-IMB/fosanalysis/issues"
"changelog" = "https://github.com/TUD-IMB/fosanalysis/blob/master/CHANGELOG.md"
"documentation" = "https://tud-imb.github.io/fosanalysis/"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"
